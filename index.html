<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metronome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f1eee8,#121212);--body:light-dark(#1b1b1b,#1c1c1c);--panel:light-dark(#ffffff,#1c1c1c);
--ink:light-dark(#1b1b1b,#f3efe6);--muted:light-dark(#6b6760,#9a958c);--line:light-dark(#dcd6cc,#2e2e2e);
--disp:#f3efe6;--dispmuted:#8f8a80;--beat:#2ec4b6;--strong:#e5484d;--sub:#7fdcd2;--off:#2c2c2c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans JP",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:620px;margin:0 auto;padding:clamp(16px,4vw,32px) 16px 64px}
h1{font:700 20px/1.2 "Noto Sans JP",sans-serif;margin:0 0 14px}
.device{background:#121212;border-radius:22px;padding:22px 16px 18px;text-align:center;color:var(--disp);
 box-shadow:0 14px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.06)}
.lamps{display:flex;justify-content:center;gap:clamp(6px,2vw,12px);flex-wrap:wrap;min-height:30px}
.lamp{--d:clamp(18px,5vw,26px);width:var(--d);height:var(--d);flex:none;border-radius:50%;background:var(--off);border:2px solid #3a3a3a}
.lamp.s1{border-color:#555}
.lamp.on{background:var(--beat);border-color:var(--beat);box-shadow:0 0 16px var(--beat)}
.lamp.on.s1{background:var(--sub);border-color:var(--sub);box-shadow:0 0 16px var(--sub)}
.lamp.on.s2{background:var(--strong);border-color:var(--strong);box-shadow:0 0 18px var(--strong)}
.big{font:400 clamp(110px,34vw,200px)/1 "Barlow Condensed",sans-serif;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.big.m{color:var(--strong)}
.big.ci{color:var(--dispmuted)}
.info .ci{color:var(--beat);font-weight:700}
.info{font:500 19px/1.3 "Barlow Condensed","Noto Sans JP",sans-serif;color:var(--dispmuted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info b{color:var(--disp);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600}
button,select,input{font:inherit;font-size:16px;color:var(--ink)}
button{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--beat);outline-offset:2px}
.play{width:100%;min-height:60px;margin-top:14px;font-weight:700;font-size:19px;background:var(--strong);color:#fff;border:0}
.play.on{background:var(--ink);color:var(--bg)}
select,input[type=number]{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px}
input[type=number]{width:88px;text-align:right}
.tempo{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:10px;align-items:center}
.tempo button{padding:0;font-size:22px}
.bpmnum{font:700 44px/1 "Barlow Condensed",sans-serif;text-align:center}
.bpmnum small{font-size:16px;color:var(--muted);margin-left:4px}
input[type=range]{width:100%;accent-color:var(--strong)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
.toggle + .toggle{border-top:1px solid var(--line)}
.toggle span small{display:block;color:var(--muted);font-size:13px}
.sw{appearance:none;width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--strong)}.sw:checked::after{left:25px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2 label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.grid2 select,.grid2 input{width:100%}
.dim{opacity:.4;pointer-events:none}
.sec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.6fr) minmax(0,1fr) 44px;gap:6px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)}
.sec label{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.sec input,.sec select{width:100%;padding:0 6px}
.sec .del{padding:0;color:var(--strong)}
.warn{color:var(--strong);font-size:14px;margin:8px 0 0;min-height:1em}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
@media(max-width:600px){.sec{grid-template-columns:repeat(2,minmax(0,1fr)) 44px}.sec label:nth-child(3),.sec label:nth-child(5){grid-column:1}.grid2{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
 <h1>Metronome</h1>

 <div class="device" aria-live="off">
  <div class="lamps" id="lamps"></div>
  <div class="big" id="big">1</div>
  <div class="info" id="info">Pause</div>
 </div>
 <button class="play" id="play">▶ Start <small>(Space)</small></button>

 <div class="card" id="manual">
  <h2>Tempo</h2>
  <div class="tempo">
   <button id="minus" aria-label="1 Tempo Down">−</button>
   <div class="bpmnum"><span id="bpmv">120</span><small>BPM</small></div>
   <button id="plus" aria-label="1 Tempo Up">＋</button>
  </div>
  <input type="range" id="bpm" min="30" max="300" value="120" aria-label="Tempo">
  <div class="row" style="justify-content:space-between">
   <div class="row"><select id="ts" aria-label="Time Signature"></select><select id="pat" aria-label="Rhythm Pattern"></select></div>
   <button id="tap">Tap Tempo</button>
  </div>
 </div>

 <div class="card">
  <h2>Visual and Sound</h2>
  <div class="toggle"><span>Major Count<small>ON：1234, 2234, 3234… ／ OFF：1234, 1234…</small></span><input type="checkbox" class="sw" id="modeA" checked></div>
  <div class="toggle"><span>Accent in First Beat</span><input type="checkbox" class="sw" id="accent" checked></div>
  <div class="grid2" style="margin-top:8px">
   <label>Count In<select id="countin"><option value="0">None</option><option value="1">1Major</option><option value="2">2Major</option><option value="4">4Major</option></select></label>
   <label>Sound<select id="sound"><option value="wood">Default</option><option value="mech">Mechanical</option><option value="beep">Electronic 1</option><option value="cowbell">Electronic 2</option><option value="none">No Sound</option></select></label>
   <label style="grid-column:1/-1">Volume<input type="range" id="vol" min="0" max="100" value="80"></label>
  </div>
  <label style="display:grid;gap:4px;font-size:13px;color:var(--muted);margin-top:10px">Volume - Offbeat/Upbeat
   <input type="range" id="subvol" min="0" max="100" value="50"></label>
  <label style="display:grid;gap:4px;font-size:13px;color:var(--muted);margin-top:10px">Visual Adjust：<span id="offv">0 ms</span>（If the Number Delays to Sound, Adjust to + Direction）
   <input type="range" id="offset" min="-150" max="150" step="5" value="0"></label>
 </div>

 <div class="card">
  <h2>Preset</h2>
  <div class="toggle"><span>Use Preset<small>To Turn On, Preset Below Will Have Priority</small></span><input type="checkbox" class="sw" id="usePreset"></div>
  <div id="secs"></div>
  <p class="warn" id="warn"></p>
  <div class="row" style="margin-top:6px">
   <button id="addSec">＋ Add Section</button>
   <label class="row" style="gap:6px;font-size:14px;color:var(--muted)">Begin With Major<input type="number" id="startM" min="1" value="1"></label>
  </div>
  <div class="row" style="margin-top:12px">
   <select id="presetList" aria-label="Saved Preset" style="flex:1"></select>
   <button id="load">Load</button><button id="delP">Delete</button>
  </div>
  <div class="row" style="margin-top:8px">
   <input id="pname" placeholder="Preset Name" style="flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px">
   <button id="save">Save</button>
  </div>
  <p class="note">All Saves Will Be Saved Only In this Browser</p>
 </div>
</div>

<script>
{
const TS={'2/4':{b:2,sub:[]},'3/4':{b:3,sub:[]},'4/4':{b:4,sub:[]},'5/4':{b:5,sub:[3]},'6/8':{b:6,sub:[3]},'7/8':{b:7,sub:[2,4]},'9/8':{b:9,sub:[3,6]},'12/8':{b:12,sub:[3,6,9]}};
const PAT={'Quarter Note':[0],'Eighth Note':[0,1/2],'Triplet':[0,1/3,2/3],'Sixteenth Note':[0,1/4,1/2,3/4],'Quintuplet':[0,.2,.4,.6,.8],'Dotted Eighth+Sixteenth Note':[0,3/4],'Shuffle':[0,2/3],'Offbeat/Eighth':[1/2]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

$('pat').innerHTML=Object.keys(PAT).map(k=>`<option>${k}</option>`).join('');
$('ts').innerHTML=Object.keys(TS).map(k=>`<option ${k==='4/4'?'selected':''}>${k}</option>`).join('');

let sections=[{start:1,end:25,ts:'4/4',bpm:150},{start:26,end:70,ts:'3/4',bpm:115}];
let presets=store.get('metro.presets',{});
let offset=store.get('metro.offset',0);

/* ---------- sound ---------- */
let ac=null,noise=null,master=null;
function initAudio(){
 if(ac)return;
 ac=new (window.AudioContext||window.webkitAudioContext)();
 master=ac.createGain();master.connect(ac.destination);
 noise=ac.createBuffer(1,ac.sampleRate*0.05,ac.sampleRate);
 const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function env(g,t,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t+0.001);g.gain.exponentialRampToValueAtTime(0.0001,t+dec)}
function nz(t,dur,dest){const s=ac.createBufferSource();s.buffer=noise;s.connect(dest);s.start(t);s.stop(t+dur)}
function osc(t,type,f,dest,dur,f2){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur*0.6);o.connect(dest);o.start(t);o.stop(t+dur+0.02)}
function click(t,level){
 const type=$('sound').value;if(type==='none')return;
 let vol;
 if(level<0){level=0;vol=$('vol').value/100*0.75*$('subvol').value/100}
 else{if(!$('accent').checked)level=0;vol=$('vol').value/100*[0.75,0.85,1][level]}
 if(vol<=0.001)return;
 if(type==='wood'){ 
  const f=[1100,1350,1700][level];
  const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=10;
  const g=ac.createGain();bp.connect(g);g.connect(master);env(g,t,vol*3,0.07);nz(t,0.07,bp);
  const g2=ac.createGain();g2.connect(master);env(g2,t,vol*0.7,0.05);osc(t,'sine',f,g2,0.05,f*0.85);
 }else if(type==='mech'){ 
  const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=[1800,2200,2600][level];
  const pk=ac.createBiquadFilter();pk.type='peaking';pk.frequency.value=[3200,3800,4400][level];pk.Q.value=3;pk.gain.value=14;
  const g=ac.createGain();hp.connect(pk);pk.connect(g);g.connect(master);env(g,t,vol*1.6,0.028);nz(t,0.04,hp);
  if(level===2&&vol>0.5){const gb=ac.createGain();gb.connect(master);env(gb,t,vol*0.35,0.45);osc(t,'sine',2637,gb,0.45);}
 }else if(type==='beep'){ 
  const f=[880,1175,1568][level];
  [[1,1],[2,0.2],[3,0.08]].forEach(([m,a])=>{const g=ac.createGain();g.connect(master);env(g,t,vol*a,0.08);osc(t,'sine',f*m,g,0.08)});
 }else if(type==='cowbell'){ 
  const k=[1,1.06,1.12][level];
  const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500*k;bp.Q.value=2.5;
  const g=ac.createGain();bp.connect(g);g.connect(master);env(g,t,vol*0.9,0.18);
  osc(t,'square',540*k,bp,0.18);osc(t,'square',800*k,bp,0.18);
 }
}
// actual speaker sound time
function heardNow(){
 try{if(ac.getOutputTimestamp){const o=ac.getOutputTimestamp();if(o.contextTime>0)return o.contextTime+(performance.now()-o.performanceTime)/1000}}catch(e){}
 return ac.currentTime-(ac.outputLatency||ac.baseLatency||0);
}
let wake=null;
async function keepAwake(on){try{if(on&&navigator.wakeLock)wake=await navigator.wakeLock.request('screen');else if(wake){await wake.release();wake=null}}catch(e){}}

/* ---------- deploy setting ---------- */
const presetOn=()=>$('usePreset').checked&&sections.length>0;
const lastEnd=()=>Math.max(...sections.map(s=>s.end));
function settingsFor(m){
 if(!presetOn())return{ts:$('ts').value,bpm:+$('bpm').value,pat:$('pat').value};
 if(m>lastEnd())return null;
 const hit=sections.find(s=>m>=s.start&&m<=s.end);
 if(hit)return withPat(hit);
 const prev=sections.filter(s=>s.start<=m).sort((a,b)=>b.start-a.start)[0];
 return withPat(prev||sections.slice().sort((a,b)=>a.start-b.start)[0]);
}
const withPat=s=>({...s,pat:s.pat||$('pat').value});

/* ---------- scheduler ---------- */
let ciLeft=0,ciTotal=0,ciM=1,playing=false,timer=null,nextT=0,curM=1,curB=0,queue=[],endT=null;
function schedule(){
 while(nextT<ac.currentTime+0.12){
  if(ciLeft>0){ // countin
   const st=settingsFor(ciM),info=TS[st.ts];
   click(nextT,curB===0?2:info.sub.includes(curB)?1:0);
   queue.push({t:nextT,beat:curB,beats:info.b,sub:info.sub,ci:ciTotal-ciLeft+1,ts:st.ts,bpm:st.bpm});
   nextT+=60/st.bpm;
   if(++curB>=info.b){curB=0;ciLeft--}
   continue;
  }
  const st=settingsFor(curM);
  if(!st){endT=nextT;clearInterval(timer);timer=null;return}
  const info=TS[st.ts];
  const lvl=curB===0?2:info.sub.includes(curB)?1:0;
  const bd=60/st.bpm,pat=PAT[st.pat]||[0];
  pat.forEach(f=>click(nextT+f*bd,f===0?lvl:-1));
  queue.push({t:nextT,beat:curB,beats:info.b,sub:info.sub,m:curM,ts:st.ts,bpm:st.bpm,pat:st.pat});
  nextT+=bd;
  if(++curB>=info.b){curB=0;curM++}
 }
}
function start(){
 try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 initAudio();ac.resume();keepAwake(true);
 curM=presetOn()?Math.max(1,+$('startM').value||1):1;
 if(presetOn()&&curM>lastEnd()){$('warn').textContent='Starting Major Error';return}
 ciTotal=ciLeft=+$('countin').value;ciM=curM;
 curB=0;queue=[];endT=null;nextT=ac.currentTime+0.08;playing=true;
 timer=setInterval(schedule,25);schedule();
 $('play').classList.add('on');$('play').innerHTML='■ Stop <small>(Space)</small>';
 requestAnimationFrame(draw);
}
function stop(msg){
 playing=false;clearInterval(timer);timer=null;queue=[];keepAwake(false);
 $('play').classList.remove('on');$('play').innerHTML='▶ Start <small>(Space)</small>';
 renderIdle(msg);
}
$('play').onclick=()=>playing?stop():start();
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)){e.preventDefault();playing?stop():start()}});

/* ---------- visual ---------- */
let lampCount=0,lampSub='';
function buildLamps(n,sub){
 if(n===lampCount&&sub.join()===lampSub)return;
 lampCount=n;lampSub=sub.join();
 $('lamps').innerHTML=Array.from({length:n},(_,i)=>`<span class="lamp ${i===0?'s2':sub.includes(i)?'s1':''}"></span>`).join('');
}
function draw(){
 if(!playing)return;
 const now=heardNow()+offset/1000;let ev=null;
 while(queue.length&&queue[0].t<=now)ev=queue.shift();
 if(ev){
  buildLamps(ev.beats,ev.sub);
  [...$('lamps').children].forEach((l,i)=>l.classList.toggle('on',i===ev.beat));
  const showM=!ev.ci&&$('modeA').checked&&ev.beat===0;
  const big=$('big');big.textContent=showM?ev.m:ev.beat+1;big.classList.toggle('m',showM);big.classList.toggle('ci',!!ev.ci);
  const tot=presetOn()?` / ${lastEnd()}`:'';
  if(ev.ci)$('info').innerHTML=`<span class="ci">Count In ${ev.ci} / ${ciTotal}</span> · <b>${esc(ev.ts)}</b> · <b>${ev.bpm}</b> BPM`;
  else $('info').innerHTML=`Major <b>${ev.m}</b>${tot} · <b>${ev.ts}</b> · <b>${ev.bpm}</b> BPM · ${esc(ev.pat)}`;
 }
 if(endT!==null&&now>=endT+0.3&&!queue.length){stop('Finish');return}
 requestAnimationFrame(draw);
}
function renderIdle(msg){
 const st=presetOn()?settingsFor(Math.max(1,+$('startM').value||1))||sections[0]:settingsFor(1);
 const info=TS[st.ts];buildLamps(info.b,info.sub);
 [...$('lamps').children].forEach(l=>l.classList.remove('on'));
 $('big').textContent='1';$('big').classList.remove('m','ci');
 $('info').innerHTML=esc(msg||'Paused')+` · <b>${esc(st.ts)}</b> · <b>${st.bpm}</b> BPM · ${esc(st.pat||$('pat').value)}`;
}

/* ---------- tempo config ---------- */
function setBpm(v){v=Math.min(300,Math.max(30,Math.round(v)));$('bpm').value=v;$('bpmv').textContent=v;if(!playing)renderIdle()}
$('bpm').oninput=e=>setBpm(+e.target.value);
$('minus').onclick=()=>setBpm(+$('bpm').value-1);
$('plus').onclick=()=>setBpm(+$('bpm').value+1);
$('ts').onchange=$('pat').onchange=()=>{if(!playing)renderIdle()};
let taps=[];
$('tap').onclick=()=>{const t=performance.now();taps=taps.filter(x=>t-x<2500);taps.push(t);
 if(taps.length>1){const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);setBpm(60000/iv)}if(taps.length>5)taps.shift()};

/* ---------- edit preset ---------- */
function renderSecs(){
 const popts=k=>`<option value="" ${!k?'selected':''}></option>`+Object.keys(PAT).map(x=>`<option ${x===k?'selected':''}>${x}</option>`).join('');
 const opts=k=>Object.keys(TS).map(x=>`<option ${x===k?'selected':''}>${x}</option>`).join('');
 $('secs').innerHTML=sections.map((s,i)=>`<div class="sec" data-i="${i}">
  <label>Start<input type="number" min="1" data-k="start" value="${s.start}"></label>
  <label>End<input type="number" min="1" data-k="end" value="${s.end}"></label>
  <label>Time Signature<select data-k="ts">${opts(s.ts)}</select></label>
  <label>Rhythm<select data-k="pat">${popts(s.pat)}</select></label>
  <label>BPM<input type="number" min="30" max="300" data-k="bpm" value="${s.bpm}"></label>
  <button class="del" aria-label="Delete This Section">✕</button></div>`).join('')||'<p class="note">No Section Found</p>';
 validate();
}
function validate(){
 const w=[];const s=sections.slice().sort((a,b)=>a.start-b.start);
 s.forEach((x,i)=>{
  if(x.end<x.start)w.push(`Major${x.start}〜${x.end}：Endpoint Error`);
  if(i>0&&x.start<=s[i-1].end)w.push(`Major${x.start} Dupe Section`);
  if(i>0&&x.start>s[i-1].end+1)w.push(`Major${s[i-1].end+1}〜${x.start-1}is blank (continue previous section settings)`);
 });
 $('warn').textContent=w.join(' ／ ');
}
$('secs').addEventListener('input',e=>{
 const row=e.target.closest('.sec');if(!row||!e.target.dataset.k)return;
 const s=sections[+row.dataset.i],k=e.target.dataset.k;
 s[k]=(k==='ts'||k==='pat')?e.target.value:Math.max(1,+e.target.value||1);
 if(k==='bpm')s.bpm=Math.min(300,Math.max(30,s.bpm));
 validate();if(!playing)renderIdle();
});
$('secs').addEventListener('click',e=>{if(!e.target.classList.contains('del'))return;
 sections.splice(+e.target.closest('.sec').dataset.i,1);renderSecs();if(!playing)renderIdle()});
$('addSec').onclick=()=>{const last=sections.length?lastEnd():0;const p=sections[sections.length-1];
 sections.push({start:last+1,end:last+16,ts:p?p.ts:'4/4',bpm:p?p.bpm:120,pat:p?p.pat||'':''});renderSecs()};
$('usePreset').onchange=()=>{$('manual').classList.toggle('dim',$('usePreset').checked);if(!playing)renderIdle()};
$('startM').oninput=()=>{if(!playing)renderIdle()};

function renderPresetList(){const n=Object.keys(presets);
 $('presetList').innerHTML=n.length?n.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join(''):'<option value="">No Preset Yet</option>'}
$('save').onclick=()=>{const n=$('pname').value.trim();if(!n){$('pname').focus();return}
 presets[n]=JSON.parse(JSON.stringify(sections));store.set('metro.presets',presets);renderPresetList();$('presetList').value=n};
$('load').onclick=()=>{const n=$('presetList').value;if(!presets[n])return;
 sections=JSON.parse(JSON.stringify(presets[n]));$('pname').value=n;renderSecs();$('usePreset').checked=true;$('usePreset').onchange()};
$('delP').onclick=()=>{const n=$('presetList').value;if(!presets[n])return;delete presets[n];store.set('metro.presets',presets);renderPresetList()};

$('countin').value=store.get('metro.countin','0');$('countin').onchange=e=>store.set('metro.countin',e.target.value);
$('offset').value=offset;$('offv').textContent=offset+' ms';
$('offset').oninput=e=>{offset=+e.target.value;$('offv').textContent=offset+' ms';store.set('metro.offset',offset)};
renderSecs();renderPresetList();setBpm(120);renderIdle();
}
</script>
</body>
</html>
